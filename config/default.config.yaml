log_level: "info"

database:
  # The default connection string for local development
  dsn: "host=host.docker.internal port=5432 user=postgres dbname=mls_sync password=postgres sslmode=disable"
  password: ""

mls:
  # Override this locally in config.yaml or use an env var (e.g., MLS_SYNC_MLS_TOKEN)
  token: ""
  # The OriginatingSystemName required by your MLS vendor
  originating_system: "actris"
  v2_url: "https://api.mlsgrid.com/v2"
  # Attachment worker media-download rate cap (requests/sec). Separate from
  # the OData API limiter (1 RPS, hardcoded in mls/client.go).
  media_download_rps: 1.0

profiling:
  # Localhost-bound pprof endpoint for the throughput investigation
  # runbook (docs/profiling.md). Default off; never enable in production.
  enabled: false
  port: 6060

processor:
  # Records committed per transaction in the raw -> typed pass. Amortizes the
  # per-record COMMIT/fsync + cursor write that dominate the I/O-bound pass.
  # On a batch error the loop retries that batch one-record-per-tx so the exact
  # poison record is still named. Set to 1 for the historical per-record
  # behavior. Override: MLS_SYNC_PROCESSOR_COMMIT_BATCH_SIZE or --commit-batch-size.
  commit_batch_size: 100

  # Overlap MLS page-fetching with the typed processor during `init` so the
  # network-bound fetch and the Postgres-bound processing run concurrently
  # (wall-clock -> max(fetch, process) instead of the sum). Delta syncs are
  # unaffected. Disable with `init --no-pipeline` for the sequential path.
  # Override: MLS_SYNC_PROCESSOR_INIT_PIPELINE.
  init_pipeline: true

  # Project each commit-chunk with batched SQL (bulk read current state, then a
  # few bulk INSERT/UPSERT/UPDATE statements) instead of per-record round-trips,
  # for resources that support it (Property + all its derivatives: Media,
  # OpenHouse, PropertyRooms, PropertyUnitTypes). Collapses ~300 round-trips
  # per 100 records to ~5. Set false to force the per-record path (kill-switch).
  # Override: MLS_SYNC_PROCESSOR_BULK or `reprocess --bulk=false`.
  bulk: true

server:
  # Listen address for the `serve` subcommand (GraphQL API). Override
  # via MLS_SYNC_SERVER_ADDR or the --addr flag.
  addr: ":8080"
  # Optional API key for /query. Empty disables auth. Clients send
  # X-API-Key: <key> or Authorization: Bearer <key>. /healthz and the
  # playground HTML stay open; playground queries need the key via the
  # headers tab. Override: MLS_SYNC_SERVER_API_KEY.
  api_key: ""
  # Comma-separated CORS allowlist; "*" allows any origin. Override:
  # MLS_SYNC_SERVER_CORS_ALLOWED_ORIGINS.
  cors_allowed_origins: "*"

storage:
  # Attachment backend. Phase 1 wires fake and local; azure and s3
  # fail loudly with "not yet available (Phase 3)" until those impls
  # land. Switch the backend via MLS_SYNC_STORAGE_BACKEND or config.yaml.
  backend: "fake"
  # Optional prefix prepended to every object key — per-deploy namespace.
  # Empty preserves today's keys (regression-safe for the existing
  # 586k job backlog). Applied at processing time, not enqueue time.
  key_prefix: ""
  local:
    # LocalStorer writes under this root; never a production path.
    root_dir: "/tmp/drain-test"
    # Hard 5 GiB ceiling — runaway-test safety bound, not an operating
    # point. Upload returns ErrLocalStorerFull at/over this.
    cap_bytes: 5368709120
  azure:
    # Test path: Azurite emulator. Prod path leaves connection_string
    # empty and uses account_url with DefaultAzureCredential.
    connection_string: ""
    account_url: ""
    container: "media"
  s3:
    # MinIO sets endpoint; real AWS leaves it empty. Static creds here
    # are TEST shapes only — prod relies on the SDK default chain.
    endpoint: ""
    bucket: "media"
    region: "us-east-1"
    access_key_id: ""
    secret_access_key: ""
    use_path_style: false
