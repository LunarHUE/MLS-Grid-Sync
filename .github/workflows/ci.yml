name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/lunarhue/mls-grid-sync

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same toolchain as local dev: the flake's `ci` shell shares its
      # package list with the default devShell (see flake.nix).
      - uses: DeterminateSystems/nix-installer-action@v16

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Build
        run: nix develop .#ci --command go build ./...

      - name: Vet
        run: nix develop .#ci --command go vet ./...

      - name: Test
        run: nix develop .#ci --command go test ./...

  docker:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Build identity injected via -X ldflags (the image has no .git). Sourced
      # from the workflow context so released images self-report their build.
      - name: Build date
        id: date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Single-platform, load:true build whose only job is to verify the
      # stamping actually lands inside the image (the failure mode this feature
      # fixes). It gates the multi-arch push. Do NOT add load:true to the
      # multi-arch push step — buildx can't load a multi-platform manifest.
      - name: Build smoke image (host arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: mls-grid-sync:smoke
          provenance: false
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.value }}
          cache-from: type=gha

      - name: Verify version stamping
        run: |
          out=$(docker run --rm mls-grid-sync:smoke version --json)
          echo "$out"
          echo "$out" | jq -e '.commit != "unknown" and .commit != ""' > /dev/null
          echo "$out" | jq -e '.buildDate != "unknown" and .buildDate != ""' > /dev/null
          echo "$out" | jq -e --arg v "${{ github.ref_name }}" '.version == $v' > /dev/null

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
