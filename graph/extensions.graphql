# Phase 3 §7: visibility-aware traversals from Property.
#
# Property.media is a new field — there is no ent edge from Property to Media
# (Media is polymorphic by resource_type + resource_record_key, see
# ent/schema/media.go). The resolver filters mlg_can_view = true so a hidden
# listing's photos disappear from GraphQL traversal even before the upstream
# Media delta lands the durable tombstone.
#
# Property.listAgent / Property.listOffice are already declared in
# ent.graphql via entgql's edge generation, but they auto-resolve through the
# ent edge loader and return tombstoned rows. The gqlgen.yml `fields` override
# for these names routes them through our custom resolvers that apply the same
# mlg_can_view = true filter.

extend type Property {
  """
  Media records that polymorphically reference this Property
  (resource_type=property, resource_record_key=listing_key). Filtered to
  mlg_can_view=true so tombstoned photos don't appear in GraphQL traversal
  even before the upstream Media delta lands.
  """
  media: [Media!]!

  # Agent and office references on a Property are SOFT KEYS — the underlying
  # *_key columns are not constrained by a DB foreign key, because real MLS
  # feeds routinely reference agents and offices that are absent from the feed
  # (retired, transferred, out of subscription). A non-null *Key with a null
  # resolved entity is a valid state: "outside this feed." Consumers see the
  # string key field regardless. All eight resolvers apply mlg_can_view=true
  # so tombstoned rows resolve null. (Each field carries its own docstring
  # below because SDL attaches a description only to the field that
  # immediately follows it.)

  """
  Listing agent via soft key listAgentKey (no DB FK). Null when the agent is
  outside this feed or tombstoned (mlg_can_view=false); listAgentKey is
  served regardless.
  """
  listAgent: Member
  """
  Co-listing agent via soft key coListAgentKey (no DB FK). Null when outside
  this feed or tombstoned; coListAgentKey is served regardless.
  """
  coListAgent: Member
  """
  Buyer's agent via soft key buyerAgentKey (no DB FK). Null when outside
  this feed or tombstoned; buyerAgentKey is served regardless.
  """
  buyerAgent: Member
  """
  Co-buyer's agent via soft key coBuyerAgentKey (no DB FK). Null when
  outside this feed or tombstoned; coBuyerAgentKey is served regardless.
  """
  coBuyerAgent: Member
  """
  Listing office via soft key listOfficeKey (no DB FK). Null when outside
  this feed or tombstoned; listOfficeKey is served regardless.
  """
  listOffice: Office
  """
  Co-listing office via soft key coListOfficeKey (no DB FK). Null when
  outside this feed or tombstoned; coListOfficeKey is served regardless.
  """
  coListOffice: Office
  """
  Buyer's office via soft key buyerOfficeKey (no DB FK). Null when outside
  this feed or tombstoned; buyerOfficeKey is served regardless.
  """
  buyerOffice: Office
  """
  Co-buyer's office via soft key coBuyerOfficeKey (no DB FK). Null when
  outside this feed or tombstoned; coBuyerOfficeKey is served regardless.
  """
  coBuyerOffice: Office
}

"""
A WGS84 coordinate pair for geo-search inputs.
"""
input GeoPoint {
  latitude: Float!
  longitude: Float!
}

extend type Query {
  """
  Properties within radiusMeters of center, measured on the WGS84
  spheroid (true meters). Only mlg_can_view=true rows with coordinates
  match; results are ID-ordered (not distance-ordered).
  """
  propertiesNear(
    center: GeoPoint!
    radiusMeters: Float!
    after: Cursor
    first: Int
    before: Cursor
    last: Int
  ): PropertyConnection!

  """
  Properties inside the lat/lng bounding box (a map viewport), boundary
  inclusive. southWest must be south and west of northEast; boxes
  crossing the antimeridian are not supported. Only mlg_can_view=true
  rows with coordinates match.
  """
  propertiesInBBox(
    southWest: GeoPoint!
    northEast: GeoPoint!
    after: Cursor
    first: Int
    before: Cursor
    last: Int
  ): PropertyConnection!

  """
  Properties inside a polygon drawn on a map — at least 3 vertices, any
  number supported, boundary inclusive. The ring closes automatically
  (the first vertex need not be repeated). Edges are straight lines in
  lat/lng space. Only mlg_can_view=true rows with coordinates match.
  """
  propertiesInPolygon(
    vertices: [GeoPoint!]!
    after: Cursor
    first: Int
    before: Cursor
    last: Int
  ): PropertyConnection!
}

extend type Member {
  """
  Member's office via soft key officeKey (no DB FK). Null when the office is
  outside this feed or tombstoned (mlg_can_view=false); officeKey is served
  regardless. See the Property soft-key notes.
  """
  office: Office
}
