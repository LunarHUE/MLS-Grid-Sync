# Phase 3 §7: visibility-aware traversals from Property.
#
# Property.media is a new field — there is no ent edge from Property to Media
# (Media is polymorphic by resource_type + resource_record_key, see
# ent/schema/media.go). The resolver filters mlg_can_view = true so a hidden
# listing's photos disappear from GraphQL traversal even before the upstream
# Media delta lands the durable tombstone.
#
# Property.listAgent / Property.listOffice are already declared in
# ent.graphql via entgql's edge generation, but they auto-resolve through the
# ent edge loader and return tombstoned rows. The gqlgen.yml `fields` override
# for these names routes them through our custom resolvers that apply the same
# mlg_can_view = true filter.

extend type Property {
  """
  Media records that polymorphically reference this Property
  (resource_type=property, resource_record_key=listing_key). Filtered to
  mlg_can_view=true so tombstoned photos don't appear in GraphQL traversal
  even before the upstream Media delta lands.
  """
  media: [Media!]!

  # Agent and office references on a Property are SOFT KEYS — the underlying
  # *_key columns are not constrained by a DB foreign key, because real MLS
  # feeds routinely reference agents and offices that are absent from the feed
  # (retired, transferred, out of subscription). A non-null *Key with a null
  # resolved entity is a valid state: "outside this feed." Consumers see the
  # string key field regardless. All eight resolvers apply mlg_can_view=true
  # so tombstoned rows resolve null. (Each field carries its own docstring
  # below because SDL attaches a description only to the field that
  # immediately follows it.)

  """
  Listing agent via soft key listAgentKey (no DB FK). Null when the agent is
  outside this feed or tombstoned (mlg_can_view=false); listAgentKey is
  served regardless.
  """
  listAgent: Member
  """
  Co-listing agent via soft key coListAgentKey (no DB FK). Null when outside
  this feed or tombstoned; coListAgentKey is served regardless.
  """
  coListAgent: Member
  """
  Buyer's agent via soft key buyerAgentKey (no DB FK). Null when outside
  this feed or tombstoned; buyerAgentKey is served regardless.
  """
  buyerAgent: Member
  """
  Co-buyer's agent via soft key coBuyerAgentKey (no DB FK). Null when
  outside this feed or tombstoned; coBuyerAgentKey is served regardless.
  """
  coBuyerAgent: Member
  """
  Listing office via soft key listOfficeKey (no DB FK). Null when outside
  this feed or tombstoned; listOfficeKey is served regardless.
  """
  listOffice: Office
  """
  Co-listing office via soft key coListOfficeKey (no DB FK). Null when
  outside this feed or tombstoned; coListOfficeKey is served regardless.
  """
  coListOffice: Office
  """
  Buyer's office via soft key buyerOfficeKey (no DB FK). Null when outside
  this feed or tombstoned; buyerOfficeKey is served regardless.
  """
  buyerOffice: Office
  """
  Co-buyer's office via soft key coBuyerOfficeKey (no DB FK). Null when
  outside this feed or tombstoned; coBuyerOfficeKey is served regardless.
  """
  coBuyerOffice: Office
}

"""
A WGS84 coordinate pair for geo-search inputs.
"""
input GeoPoint {
  latitude: Float!
  longitude: Float!
}

"""
A lat/lng bounding box (a map viewport). southWest must be south and west of
northEast; boxes crossing the antimeridian are not supported.
"""
input Bounds {
  southWest: GeoPoint!
  northEast: GeoPoint!
}

"""
A geo-region predicate composed into the property list queries. Exactly one of
withinPolygons, withinBounds, or withinRadius must be set; it is AND-combined
with `where` (facets) and any address search, and enforced server-side so the
list, its totalCount, and map pins all share one predicate. Each sub-field is a
distinct region test: withinPolygons (point inside any of a set of polygons),
withinBounds (point inside a bounding box), withinRadius (point within a
distance of a center). Only mlg_can_view=true rows with coordinates match.
"""
input GeoFilter {
  """
  Point inside ANY of these polygons (a multipolygon search over discontiguous
  regions, e.g. a handful of separate neighborhoods). Each polygon is a ring of
  at least 3 GeoPoints (the ring closes automatically), at most 64 polygons and
  4096 total vertices, boundary inclusive.
  """
  withinPolygons: [[GeoPoint!]!]
  """
  Point inside this lat/lng bounding box (a map viewport), boundary inclusive.
  southWest must be south and west of northEast; antimeridian-crossing boxes
  are not supported.
  """
  withinBounds: Bounds
  """
  Point within radiusMeters of center, measured on the WGS84 spheroid (true
  meters).
  """
  withinRadius: RadiusFilter
}

"""
A center + radius (meters) circle for GeoFilter.withinRadius, measured on the
WGS84 spheroid (ST_DWithin on geography).
"""
input RadiusFilter {
  center: GeoPoint!
  radiusMeters: Float!
}

extend type Query {
  """
  The Property list. Optional `where` (facets) and `geo` (a polygon, bounding
  box, or radius region) are AND-combined and enforced server-side, so the
  list, its totalCount, and map pins all share one predicate. Only
  mlg_can_view=true rows match; results are ID-ordered for stable cursor
  pagination. Pass a GeoFilter to constrain results to a polygon, bounding
  box, or radius region.
  """
  properties(
    after: Cursor
    first: Int
    before: Cursor
    last: Int
    orderBy: PropertyOrder
    where: PropertyWhereInput
    geo: GeoFilter
  ): PropertyConnection!
}

extend type Query {
  """
  Properties within radiusMeters of center, measured on the WGS84
  spheroid (true meters). Only mlg_can_view=true rows with coordinates
  match; results are ID-ordered (not distance-ordered).
  """
  propertiesNear(
    center: GeoPoint!
    radiusMeters: Float!
    after: Cursor
    first: Int
    before: Cursor
    last: Int
    orderBy: PropertyOrder
    where: PropertyWhereInput
  ): PropertyConnection!

  """
  Properties inside the lat/lng bounding box (a map viewport), boundary
  inclusive. southWest must be south and west of northEast; boxes
  crossing the antimeridian are not supported. Only mlg_can_view=true
  rows with coordinates match.
  """
  propertiesInBBox(
    bounds: Bounds!
    after: Cursor
    first: Int
    before: Cursor
    last: Int
    orderBy: PropertyOrder
    where: PropertyWhereInput
  ): PropertyConnection!

  """
  Properties inside ANY of several polygons — a multipolygon search over
  discontiguous regions (e.g. a handful of separate neighborhoods) in one
  query. Each polygon is a ring of GeoPoints with at least 3 vertices; the
  ring closes automatically (the first vertex need not be repeated), edges
  are straight lines in lat/lng space, and the boundary is inclusive. A
  property matches if it falls inside any one of the polygons. At most 64
  polygons and 4096 total vertices across all of them. For a single search
  region, pass a one-element list. Only mlg_can_view=true rows with
  coordinates match.
  """
  propertiesInMultiPolygon(
    polygons: [[GeoPoint!]!]!
    after: Cursor
    first: Int
    before: Cursor
    last: Int
    orderBy: PropertyOrder
    where: PropertyWhereInput
  ): PropertyConnection!
}

extend type Query {
  """
  Fuzzy free-text address search (a single search box). query is matched
  with PostgreSQL trigram similarity (pg_trgm word_similarity) against a
  combined address — street number + street name + city + state + postal
  code — so typos and partial inputs ("123 Mian St Austin", "Maplewod
  Ave") still match. threshold (0..1, default 0.3) sets how loose a match
  is: higher is stricter. As a special case, an all-digit query (a ZIP or
  ZIP+4 like "78704" or "78704-1234") skips trigram and does an exact /
  prefix postal_code lookup, because bare digits share no useful trigrams
  with an address. Only mlg_can_view=true rows match; results are
  ID-ordered (not relevance-ordered) so they remain stable for cursor
  pagination.
  """
  propertiesByAddress(
    query: String!
    threshold: Float
    after: Cursor
    first: Int
    before: Cursor
    last: Int
    orderBy: PropertyOrder
    where: PropertyWhereInput
    geo: GeoFilter
  ): PropertyConnection!

  """
  Structured address search (separate fields, e.g. an advanced-search
  form). Every field is optional; the ones provided are AND-combined.
  street and city are fuzzy (trigram word_similarity, governed by
  threshold — 0..1, default 0.3). state is matched case-insensitively and
  exactly. zip is matched exactly when it is a full 5-digit code, otherwise
  as a prefix ("787" matches 787xx). At least one of street/city/state/zip
  must be provided. Only mlg_can_view=true rows match; results are
  ID-ordered for stable cursor pagination.
  """
  propertiesByAddressFields(
    street: String
    city: String
    state: String
    zip: String
    threshold: Float
    after: Cursor
    first: Int
    before: Cursor
    last: Int
    orderBy: PropertyOrder
    where: PropertyWhereInput
    geo: GeoFilter
  ): PropertyConnection!
}

extend type Member {
  """
  Member's office via soft key officeKey (no DB FK). Null when the office is
  outside this feed or tombstoned (mlg_can_view=false); officeKey is served
  regardless. See the Property soft-key notes.
  """
  office: Office
}
