scalar UUID
scalar Decimal
scalar StringArray
# Time and Map are hand-maintained here as a fallback. Although Phase 3
# where-inputs (WithWhereInputs) make every entity expose time/Map predicates,
# the entgql version pinned in go.mod does NOT emit `scalar Time` / `scalar Map`
# into ent.graphql — so without these declarations gqlgen fails with
# "Undefined type Time/Map". UUID/Decimal/StringArray are entgql.Skip-ed from
# where-inputs and likewise never emitted, so they stay here too.
scalar Time
scalar Map
