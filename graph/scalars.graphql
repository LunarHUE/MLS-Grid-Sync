# UUID/Decimal/StringArray are entgql.Skip-ed from where-inputs, so entgql never
# emits them into ent.graphql — they are declared here. Time and Map are NOT
# declared here: WithWhereInputs(true) makes entities expose Time/Map predicates,
# so the pinned entgql now emits `scalar Time` / `scalar Map` into ent.graphql
# itself. Re-declaring them here would make gqlgen fail with "Cannot redeclare
# type Time/Map".
scalar UUID
scalar Decimal
scalar StringArray
