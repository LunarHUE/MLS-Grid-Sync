services:
  db:
    # Multi-arch PostGIS on the same alpine/musl base as the previous
    # postgres:15-alpine — the existing volume keeps working; the geo
    # migration (CREATE EXTENSION postgis + geom column) runs from the app.
    image: imresamu/postgis:15-3.5-alpine
    container_name: mls_sync_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mls_sync
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    name: mls_sync_pgdata