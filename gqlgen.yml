schema:
  - graph/*.graphql

exec:
  filename: graph/generated.go
  package: graph

# Where gqlgen puts models for schema types with no ent binding
# (currently just the GeoPoint input used by the geo-search queries).
model:
  filename: graph/model/models_gen.go
  package: model

autobind:
  - github.com/LunarHUE/MLS-Grid-Sync/ent

models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
      - github.com/99designs/gqlgen/graphql.String
  Int:
    model:
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int32
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Int16
  UUID:
    model:
      - github.com/99designs/gqlgen/graphql.String
  Decimal:
    model:
      - github.com/99designs/gqlgen/graphql.String
      - github.com/LunarHUE/MLS-Grid-Sync/graph/scalar.Decimal
  StringArray:
    model:
      - github.com/99designs/gqlgen/graphql.Any
  Node:
    model:
      - github.com/LunarHUE/MLS-Grid-Sync/ent.Noder
  # Property.listAgent / listOffice (and the 6 sibling co-list/buyer/co-buyer
  # roles, plus Member.office) are declared in graph/extensions.graphql now —
  # they are no longer ent edges, so entgql doesn't emit them and there's no
  # auto-resolver to override. The manual resolvers in graph/resolver.go apply
  # the mlg_can_view=true visibility filter directly.
